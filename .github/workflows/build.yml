name: Build ROM

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Z80 assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y pasmo
      - name: Build and verify ROM images
        run: make verify
      - name: Show output files
        run: ls -l build/
      - name: Upload ROM build
        uses: actions/upload-artifact@v4
        with:
          name: imsai-target-monitor-v0.1
          path: |
            build/IMSAI_TARGET_MONITOR_4K.bin
            build/IMSAI_TARGET_MONITOR_28C64.bin
            build/monitor.raw.bin
            build/monitor.sym
