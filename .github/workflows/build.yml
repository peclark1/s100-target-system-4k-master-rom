name: Build ROM

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Z80 assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y pasmo
      - name: Build and verify ROM images
        run: make verify
      - name: Show output files
        run: ls -l build/
